# SonarQube project configuration for the harness itself.
#
# Written 2026-09-05, after the first scan was run with `-Dsonar.sources=.` and
# nothing else. That was wrong in BOTH directions and the server said so:
# "files that look like test code but 'sonar.tests' is not configured. Rules
# targeting production code were not executed on these files."
#
#   - Every test file was judged as PRODUCTION code, so production rules fired
#     on fixtures and helpers. Three of the eight "vulnerabilities" in that run
#     were Math.random() calls in files that exist SPECIFICALLY to contain
#     Math.random(), because a harness guard is proven against them.
#   - And production rules were withheld from files it guessed were tests, so
#     the run was simultaneously inflated with noise and incomplete on the code
#     that matters.
#
# A number produced from that configuration is not a measurement of this
# codebase. Splitting sources from tests is the fix; dismissing the resulting
# noise issue-by-issue would have been treating the symptom.

sonar.projectKey=AI-Harness
sonar.projectName=AI-Harness

# Production code: the workflow scripts, the hooks, and the shipped scripts.
sonar.sources=workflows,hooks,bin

# Test code: analysed with test rules, not production ones.
sonar.tests=test,hooks/test_plan_guard_stop.py

sonar.sourceEncoding=UTF-8

# Never analysed: build output, VCS internals, agent worktrees (which contain
# full copies of the tree and would multiply every finding), and scanner state.
# hooks/test_*.py is listed under sonar.tests, so it must be excluded from
# SOURCES or the scanner refuses: a file cannot be indexed as both.
sonar.exclusions=hooks/test_*.py,**/node_modules/**,**/.git/**,**/.claude/worktrees/**,**/.scannerwork/**,**/coverage/**

# ---------------------------------------------------------------------------
# Coverage. Read this before believing the number on the dashboard.
#
# The figure covers 4,695 lines: the four workflows/lib/*.mjs modules and
# bin/redact-transcript.mjs. It does NOT cover workflows/*.js -- roughly 3,865
# further lines, about half the production JavaScript here, and the most heavily
# tested files in the repo.
#
# That is not an oversight and no tool can fix it. Dynamic workflow scripts are
# compiled from source TEXT at run time, in production and under test alike, so
# V8 attributes no coverage to a file for them. They are exercised by hundreds
# of tests through a fake runtime; none of it is attributable.
#
# They are EXCLUDED rather than left to report 0%, deliberately. A 0% on a file
# with hundreds of passing tests is an absence displayed as a fact -- the exact
# defect class this repo exists to catch, and which this dashboard was doing to
# itself until 2026-09-05, when it read 0% overall purely because no report had
# ever been uploaded. "Excluded, and here is why" is true. "0%" is not.
#
# What the number therefore means: of the code that CAN be measured, this much
# is covered. It is not a statement about the repo as a whole, and it must never
# be quoted as one.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage/python-coverage.xml
#
# Two hooks are excluded for the SAME structural reason as workflows/*.js, not
# because they are untested. hooks/destructive-git-guard.py and
# hooks/git-snapshot.py are exercised by ~120 Node tests that SPAWN them as
# subprocesses, which is how production invokes them. coverage.py measures the
# interpreter it runs in, so a subprocess it did not start is invisible to it.
# Measured, not assumed: both report 0% while their suites pass in full.
#
# hooks/plan-guard-stop.py is NOT excluded: its tests import it directly, so its
# 78% is a real measurement and is published as one.
#
# RECORDED DEBT, not a resolved item: subprocess coverage IS obtainable via
# COVERAGE_PROCESS_START and a sitecustomize hook. That is environment surgery
# and was judged out of proportion today. Until someone does it, roughly 400
# further lines are tested and unmeasured, and this comment is the only place
# that says so.
sonar.coverage.exclusions=workflows/*.js,hooks/destructive-git-guard.py,hooks/git-snapshot.py
